appId: com.chromashift.desktop
productName: ChromaShift
copyright: Copyright © 2026 ChromaShift
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # ChromaShift still loads its local renderer from file://. Keep only the
  # privileges required by that reviewed architecture until a custom protocol
  # has a concrete containment requirement and test suite.
  grantFileProtocolExtraPrivileges: true

directories:
  output: release
  buildResources: build

afterPack: ./scripts/prune-electron-runtime.mjs

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!node_modules/**/*'

electronLanguages:
  - en-US

# ChromaShift has no audio or video playback surface. Use Electron's official
# non-proprietary codec build instead of shipping unused media codecs.
downloadAlternateFFmpeg: true

extraResources:
  - from: build/chromashift-icon-lightmode.png
    to: chromashift-icon-lightmode.png
  - from: ../../native/DisplayService/bin/Release/net10.0-windows/win-x64/publish
    to: display-service
    filter:
      - '**/*'
      - '!**/*.pdb'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/chromashift-icon-lightmode.png
  executableName: ChromaShift
  artifactName: ChromaShift-${version}-${arch}-setup.${ext}
  signAndEditExecutable: true

publish:
  - provider: github
    owner: designmatty
    repo: chromashift

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChromaShift
  uninstallDisplayName: ChromaShift
  # NSIS requires a 150 x 57 BMP; this is derived from chromashift-logo-lightmode.png.
  installerHeader: build/chromashift-logo-lightmode.bmp
  deleteAppDataOnUninstall: false
