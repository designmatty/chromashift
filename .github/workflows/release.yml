name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-release:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package metadata
        run: npm run release:preflight -- --tag $env:GITHUB_REF_NAME

      - name: Run canonical verification
        run: npm run verify

      - name: Build Windows installer
        id: package
        shell: pwsh
        run: |
          $hasSigningCredentials =
            -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and
            -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          $isPrerelease = $env:GITHUB_REF_NAME.Contains('-')

          if ($hasSigningCredentials) {
            npm run package:release
            "signed=true" >> $env:GITHUB_OUTPUT
          } elseif ($isPrerelease) {
            npm run package:win
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            throw 'Stable releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.'
          }
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify installer and update manifest
        run: npm run release:preflight -- --tag $env:GITHUB_REF_NAME --artifacts

      - name: Verify Authenticode signatures
        if: steps.package.outputs.signed == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $paths = @(
            "apps/desktop/release/ChromaShift-$version-x64-setup.exe",
            "apps/desktop/release/win-unpacked/ChromaShift.exe",
            "apps/desktop/release/win-unpacked/resources/display-service/ChromaShift.DisplayService.exe"
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChromaShift-${{ github.ref_name }}-x64
          if-no-files-found: error
          path: |
            apps/desktop/release/ChromaShift-*-x64-setup.exe
            apps/desktop/release/ChromaShift-*-x64-setup.exe.blockmap
            apps/desktop/release/latest.yml

      - name: Publish draft GitHub release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "apps/desktop/release/ChromaShift-$version-x64-setup.exe"
          $arguments = @(
            $env:GITHUB_REF_NAME,
            $installer,
            "$installer.blockmap",
            'apps/desktop/release/latest.yml',
            '--draft',
            '--verify-tag',
            '--generate-notes'
          )
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $arguments += '--prerelease'
          }
          gh release create @arguments
        env:
          GH_TOKEN: ${{ github.token }}
