name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release-signing

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package metadata
        run: npm run release:preflight -- --tag $env:GITHUB_REF_NAME

      - name: Run canonical verification
        run: npm run verify

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build unpacked Windows application
        run: npm run package:release:prepare

      - name: Authenticate to Azure through OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign packaged executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\apps\desktop\release\win-unpacked\ChromaShift.exe
            ${{ github.workspace }}\apps\desktop\release\win-unpacked\resources\display-service\ChromaShift.DisplayService.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify packaged executable signatures
        shell: pwsh
        run: |
          ./scripts/verify-authenticode.ps1 -Paths @(
            'apps/desktop/release/win-unpacked/ChromaShift.exe',
            'apps/desktop/release/win-unpacked/resources/display-service/ChromaShift.DisplayService.exe'
          ) -ExpectedPublisher $env:CHROMASHIFT_EXPECTED_PUBLISHER
        env:
          CHROMASHIFT_EXPECTED_PUBLISHER: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER }}

      - name: Build Windows installer from signed application
        run: npm run package:release:installer

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\desktop\release\ChromaShift-${{ steps.version.outputs.value }}-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Finalize signed update metadata
        run: npm run package:release:finalize

      - name: Verify release artifacts and Authenticode signatures
        run: npm run release:preflight -- --tag $env:GITHUB_REF_NAME --artifacts --signatures --expected-publisher $env:CHROMASHIFT_EXPECTED_PUBLISHER
        env:
          CHROMASHIFT_EXPECTED_PUBLISHER: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChromaShift-${{ github.ref_name }}-x64
          if-no-files-found: error
          path: |
            apps/desktop/release/ChromaShift-*-x64-setup.exe
            apps/desktop/release/ChromaShift-*-x64-setup.exe.blockmap
            apps/desktop/release/latest.yml

      - name: Publish draft GitHub release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "apps/desktop/release/ChromaShift-$version-x64-setup.exe"
          $arguments = @(
            $env:GITHUB_REF_NAME,
            $installer,
            "$installer.blockmap",
            'apps/desktop/release/latest.yml',
            '--draft',
            '--verify-tag',
            '--generate-notes'
          )
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $arguments += '--prerelease'
          }
          gh release create @arguments
        env:
          GH_TOKEN: ${{ github.token }}
