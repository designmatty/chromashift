name: Publish update feed

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

concurrency:
  group: update-feed-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: update-feed
    steps:
      - name: Check out current feed publisher
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - name: Install feed tools
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate metadata from published releases
        run: npm run updates:build
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate feed contract and publication
        run: node --test scripts/update-feed.test.mjs
      - name: Deploy update Worker
        run: npm run updates:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public feed after propagation
        shell: bash
        run: |
          for attempt in {1..6}; do
            if node scripts/update-feed-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done
          exit 1
